[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-agent"
version = "0.1.0"
description = "Autonomous, execution-backed verification of public AI/ML claims"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "google-adk==2.7.1",
  "google-genai==2.19.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "pydantic-settings==2.15.0",
  "google-cloud-firestore==2.28.1",
  "google-cloud-pubsub==2.39.1",
  "google-cloud-run==0.16.1",
  "google-cloud-logging==3.16.2",
  "opentelemetry-exporter-gcp-trace==1.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
]

deploy = ["google-agents-cli==1.4.0"]

[project.scripts]
verity-api = "verity.api:run"
verity-worker = "verity.worker:main"
verity-sandbox = "verity.sandbox_runner:main"

[tool.setuptools.packages.find]
include = ["app*", "verity*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires network access and Gemini credentials",
  "cloud: requires authenticated Google Cloud resources",
  "docker: requires a running Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
